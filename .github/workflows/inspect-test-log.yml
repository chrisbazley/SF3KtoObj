name: Inspect Windows test log
on:
  push:
    branches: [diagnose/windows-job-136332722699]
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/chrisbazley/SF3KtoObj/actions/jobs/136332722699/logs > "$RUNNER_TEMP/job.log"
          grep -iE 'CMake Error|\*\*\*Timeout|\*\*\*Failed|tests passed|test #[12]:|converting .*\.obj|conversion failed with code|download failed|timeout was reached|Checksum mismatch|see fortify|^.*-- Extracting' "$RUNNER_TEMP/job.log" | tail -80
